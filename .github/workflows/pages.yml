name: Deploy research paper

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload paper
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy paper
        id: deployment
        uses: actions/deploy-pages@v4